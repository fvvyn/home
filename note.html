// ===== 表示制御 =====
const listView = document.getElementById("listView");
const articleView = document.getElementById("articleView");
const cardGrid = document.getElementById("cardGrid");
const emptyNote = document.getElementById("emptyNote");
const articleBody = document.getElementById("articleBody");
const progress = document.getElementById("progress");

function renderCards(filter = "all") {
  const items = ARTICLES.filter(a => filter === "all" || a.cat === filter);
  cardGrid.innerHTML = items.map(a => `
    <article class="card ${a.status === "open" ? "is-open" : "is-soon"}" ${a.status === "open" ? `data-open="${a.id}" tabindex="0" role="button"` : ""}>
      <div class="card-meta"><span class="card-cat">${a.catLabel}</span><span>${a.date}</span></div>
      <h2>${a.title}</h2>
      <p>${a.excerpt}</p>
      <div class="card-foot">${a.status === "open" ? "読む →" : "近日公開"}</div>
    </article>
  `).join("");
  emptyNote.hidden = items.length > 0;
  cardGrid.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => openArticle(el.dataset.open));
    el.addEventListener("keydown", e => { if (e.key === "Enter") openArticle(el.dataset.open); });
  });
}

function openArticle(id) {
  const a = ARTICLES.find(x => x.id === id && x.status === "open");
  if (!a) return;
  articleBody.innerHTML = `
    <div class="article-meta"><span class="article-cat">${a.catLabel}</span><span>${a.date}</span><span>fvvyn | NOTE</span></div>
    <h1>${a.title}</h1>
    ${a.body}
  `;
  listView.hidden = true;
  articleView.hidden = false;
  if (location.hash !== "#" + id) history.pushState(null, "", "#" + id);
  // GA4: 記事を1ページビューとして計測
  if (window.gtag) gtag('event', 'page_view', {
    page_title: a.title + ' | fvvyn | NOTE',
    page_location: location.origin + location.pathname + '#' + id
  });
  window.scrollTo({ top: 0 });
}

function showList() {
  articleView.hidden = true;
  listView.hidden = false;
  if (location.hash) history.pushState(null, "", location.pathname);
  // GA4: 一覧に戻ったことも1ページビューとして計測
  if (window.gtag) gtag('event', 'page_view', {
    page_title: 'fvvyn | NOTE | 最新情報、fvvynの裏側をお届け',
    page_location: location.origin + location.pathname
  });
  window.scrollTo({ top: 0 });
  progress.style.width = "0";
}

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("is-active", b === btn));
  renderCards(btn.dataset.filter);
});
document.getElementById("backBtn").addEventListener("click", showList);
document.getElementById("backBtn2").addEventListener("click", showList);
document.getElementById("homeLink").addEventListener("click", e => { e.preventDefault(); showList(); });

window.addEventListener("popstate", () => {
  const id = location.hash.replace("#", "");
  if (id) openArticle(id); else showList();
});
window.addEventListener("scroll", () => {
  if (articleView.hidden) return;
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  progress.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
}, { passive: true });

// 初期表示（#id 直リンク対応）
renderCards();
const initial = location.hash.replace("#", "");
if (initial) openArticle(initial);
</script>
